name: Fix control cutoff

on:
  push:
    paths:
      - '.github/workflows/fix-control-cutoff.yml'

permissions:
  contents: write

jobs:
  fix:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0
      - name: Apply July cutoff
        run: |
          python - <<'PY'
          from pathlib import Path
          p=Path('src/shared/domain/index.jsx')
          s=p.read_text(encoding='utf-8')
          old='const FECHA_CORTE_CONTROL_ROP="2026-06-01"; // después del 31/05'
          new='const FECHA_CORTE_CONTROL_ROP="2026-07-01"; // los registros previos a julio no participan del control operativo'
          if old in s:
              s=s.replace(old,new,1)
          elif 'FECHA_CORTE_CONTROL_ROP="2026-07-01"' not in s:
              raise SystemExit('No se encontró el corte de Control ROP02 vs ROP05')
          p.write_text(s,encoding='utf-8')
          Path('.github/workflows/fix-control-cutoff.yml').unlink(missing_ok=True)
          PY
      - name: Validate
        run: |
          npm ci
          npm run check
          npm run validate
          npm run build
      - name: Commit
        run: |
          git config user.name "Delta Mining Migration Bot"
          git config user.email "actions@users.noreply.github.com"
          git add -A
          git commit -m "Ignorar registros previos a julio en Control ROP02 vs ROP05"
          git push origin HEAD:main
