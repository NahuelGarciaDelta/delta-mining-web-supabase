name: Finalize Supabase parity

on:
  push:
    branches: [main]
    paths:
      - 'scripts/complete_parity_20260827.mjs'
      - 'scripts/final_exact_parity_files.mjs'
      - 'docs/appscript/AppsScript_Supabase_AllSources.js'
      - '.github/workflows/finalize-supabase-parity.yml'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  finalize:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Checkout migrated app
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - name: Install dependencies
        run: npm ci
      - name: Validate completion script syntax
        run: node --check scripts/complete_parity_20260827.mjs && node --check scripts/final_exact_parity_files.mjs
      - name: Apply reviewed functional merge
        run: node scripts/complete_parity_20260827.mjs && node scripts/final_exact_parity_files.mjs
      - name: Build ready-to-paste Supabase Apps Script
        run: |
          mkdir -p docs/appscript
          cp AppsScript_Delta_Mining_OPS_ROP02_OK.txt docs/appscript/AppsScript_Supabase_ReadyToPaste.gs
          printf '\n\n/* ===== SUPABASE ALL-SOURCES ADDON ===== */\n\n' >> docs/appscript/AppsScript_Supabase_ReadyToPaste.gs
          cat docs/appscript/AppsScript_Supabase_AllSources.js >> docs/appscript/AppsScript_Supabase_ReadyToPaste.gs
      - name: Check Apps Script bundle
        run: |
          test -s docs/appscript/AppsScript_Supabase_ReadyToPaste.gs
          grep -q 'syncAllConfiguredDatasetsToSupabase' docs/appscript/AppsScript_Supabase_ReadyToPaste.gs
          grep -q 'syncSupabaseOutboxToSheets' docs/appscript/AppsScript_Supabase_ReadyToPaste.gs
          grep -q 'SUPABASE_SERVICE_ROLE_KEY' docs/appscript/AppsScript_Supabase_ReadyToPaste.gs
      - name: Check patch integrity
        run: git diff --check
      - name: Full verification
        run: npm run verify:all
      - name: Show resulting changes
        run: git status --short && git diff --stat
      - name: Commit verified parity result
        run: |
          if git diff --quiet; then
            echo 'No changes to commit.'
            exit 0
          fi
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -A
          git commit -m 'Publish verified Supabase app and Apps Script bundle'
          git push origin HEAD:main
