name: Finalize Supabase parity

on:
  push:
    branches: [main]
    paths:
      - 'scripts/complete_parity_20260827.mjs'
      - '.github/workflows/finalize-supabase-parity.yml'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  finalize:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Checkout migrated app
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - name: Install dependencies
        run: npm ci
      - name: Validate completion script syntax
        run: node --check scripts/complete_parity_20260827.mjs
      - name: Apply reviewed functional merge
        run: node scripts/complete_parity_20260827.mjs
      - name: Check patch integrity
        run: git diff --check
      - name: Full verification
        run: npm run verify:all
      - name: Show resulting changes
        run: git status --short && git diff --stat
      - name: Commit verified parity result
        run: |
          if git diff --quiet; then
            echo 'No changes to commit.'
            exit 0
          fi
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -A
          git commit -m 'Complete Supabase parity with current original'
          git push origin HEAD:main
