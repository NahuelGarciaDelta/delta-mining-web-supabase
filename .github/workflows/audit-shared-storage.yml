name: Audit shared storage
on:
  push:
    paths:
      - '.github/workflows/audit-shared-storage.yml'
permissions:
  contents: read
jobs:
  audit:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Find legacy storage calls
        run: |
          echo '=== APPS_SCRIPT_URL ==='
          grep -RIn 'APPS_SCRIPT_URL' src --include='*.js' --include='*.jsx' | head -n 1200 || true
          echo '=== action names ==='
          grep -RInE 'save_|update_|delete_|registrar_|guardar_|upload_|stock_|movimiento|programacion|repuesto' src/modules src/services --include='*.js' --include='*.jsx' | head -n 1500 || true
          echo '=== local/session storage ==='
          grep -RInE 'localStorage|sessionStorage' src/modules src/services --include='*.js' --include='*.jsx' | head -n 1000 || true
