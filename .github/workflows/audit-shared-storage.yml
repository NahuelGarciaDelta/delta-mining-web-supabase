name: Audit shared storage
on:
  push:
    paths:
      - '.github/workflows/audit-shared-storage.yml'
permissions:
  contents: read
jobs:
  audit:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Find legacy storage calls
        run: |
          echo '=== APPS_SCRIPT_URL / fetch POST / actions ==='
          grep -RInE 'APPS_SCRIPT_URL|method:[[:space:]]*["'"']POST|action:[[:space:]]*["'"']|action=' src --include='*.js' --include='*.jsx' | head -n 1200 || true
          echo '=== localStorage shared-looking keys ==='
          grep -RInE 'localStorage|sessionStorage' src/modules src/services --include='*.js' --include='*.jsx' | head -n 800 || true
