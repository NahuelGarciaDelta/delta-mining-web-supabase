name: Validate Abastecimiento remito sync fix

on:
  push:
    branches:
      - fix/abastecimiento-remito-sync-20260915

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
      - run: npm ci
      - name: Regression tests
        run: node --test tests/abastecimiento-write-reliability.test.mjs tests/abastecimiento-regression.test.mjs
      - name: Full tests
        run: npm test
      - name: Build
        run: npm run build
      - name: Diff check
        run: git diff --check HEAD^
