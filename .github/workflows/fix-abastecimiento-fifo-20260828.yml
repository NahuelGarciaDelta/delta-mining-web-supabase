# run 2026-08-28
name: Fix Abastecimiento FIFO parity 2026-08-28
on:
  push:
    branches: [main]
    paths: ['.github/workflows/fix-abastecimiento-fifo-20260828.yml']
permissions:
  contents: write
jobs:
  fix:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with: {fetch-depth: 0}
      - name: Clone original
        run: git clone --depth 1 https://github.com/NahuelGarciaDelta/delta-mining-ops.git /tmp/original
      - name: Restore exact original allocation while preserving Supabase transport
        run: |
          python3 - <<'PY'
          from pathlib import Path
          p=Path('src/modules/abastecimiento/AbastecimientoModule.jsx')
          o=Path('/tmp/original/src/modules/abastecimiento/AbastecimientoModule.jsx').read_text()
          s=p.read_text()
          if 'const parseChronoDateMs=' not in s:
              anchor='const RABA03_CLOSED_STORAGE_KEY = "dm_raba03_solicitudes_cerradas_manual_v1";\n'
              a=o.index('const parseChronoDateMs='); b=o.index('const STOCK_CONTROL_COLUMNS',a)
              s=s.replace(anchor,anchor+o[a:b],1)
          a=o.index('  const normalizeRow=useCallback'); b=o.index('  const buildSolicitudKey=useCallback',a)
          ta=s.index('  const normalizeRow=useCallback'); tb=s.index('  const buildSolicitudKey=useCallback',ta)
          s=s[:ta]+o[a:b]+s[tb:]
          oa=o.index('  const mapRaba03Rows=useCallback'); ob=o.index('  const loadRaba03=useCallback',oa)
          ta=s.index('  const mapRaba03Rows=useCallback'); tb=s.index('  const loadRaba03=useCallback',ta)
          s=s[:ta]+o[oa:ob]+s[tb:]
          old='''      const sentMap=Array.isArray(remitosOverride)?buildSentByCode(remitosOverride):sentByCodeRef.current;\n      const normalizedRows=mapRaba03Rows(raw,sentMap);'''
          new='''      const sourceRemitos=Array.isArray(remitosOverride)?remitosOverride:remitos;\n      const normalizedRows=mapRaba03Rows(raw,sourceRemitos);'''
          if old not in s: raise SystemExit('Supabase loadRaba03 allocation pattern not found')
          s=s.replace(old,new,1)
          s=s.replace('  },[mapRaba03Rows,buildSentByCode]);','  },[mapRaba03Rows,remitos]);',1)
          s=s.replace('const refresh=()=>setRows(mapRaba03Rows(rawRaba03RowsRef.current,sentByCode));','const refresh=()=>setRows(mapRaba03Rows(rawRaba03RowsRef.current,remitos));',1)
          p.write_text(s)
          x=p.read_text()
          assert 'const allocateRemitosToRequests=useCallback' in x
          assert 'const parseChronoDateMs=' in x
          assert 'const mapRaba03Rows=useCallback((raw=[],sourceRemitos=[])' in x
          assert 'const sourceRemitos=Array.isArray(remitosOverride)?remitosOverride:remitos;' in x
          assert 'normalizeRow(row,index,sentMap)' not in x
          assert 'const enviada=(sentMap[' not in x
          PY
      - name: Verify all
        run: npm ci && npm run verify:all
      - name: Commit verified fix
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add src/modules/abastecimiento/AbastecimientoModule.jsx
          git rm .github/workflows/fix-abastecimiento-fifo-20260828.yml
          git commit -m 'Restore original Abastecimiento remito allocation'
          git push origin main
