name: Restore original data infrastructure

on:
  push:
    paths:
      - '.github/workflows/restore-original-data-infrastructure.yml'

permissions:
  contents: write

jobs:
  restore:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0
      - name: Restore original ROP02 data flow
        run: python -c "import base64;exec(base64.b64decode(''))"
      - name: Validate source changes
        run: |
          npm ci
          npm run check
          npm run validate
          npm run build
      - name: Commit restored infrastructure
        run: |
          git config user.name "Delta Mining Migration Bot"
          git config user.email "actions@users.noreply.github.com"
          git add -A
          if git diff --cached --quiet; then
            echo "No changes to commit"
            exit 0
          fi
          git commit -m "Restaurar infraestructura ROP02 original sobre Supabase"
          git push origin HEAD:main
