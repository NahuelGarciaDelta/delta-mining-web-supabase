name: Instant tabs
on:
  push:
    paths:
      - '.github/workflows/instant-tabs.yml'
permissions:
  contents: write
jobs:
  optimize:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0
      - name: Apply instant navigation patch
        run: python .github/scripts/instant_tabs_patch.py
      - name: Validate
        run: |
          npm ci
          npm run check
          npm run validate
          npm run build
      - name: Commit
        run: |
          rm -f .github/workflows/instant-tabs.yml .github/scripts/instant_tabs_patch.py
          git config user.name "NahuelGarciaDelta"
          git config user.email "nahuel.garcia@deltamining.com.ar"
          git add -A
          git commit -m "Hacer instantánea la apertura de todas las pestañas"
          git push origin main
