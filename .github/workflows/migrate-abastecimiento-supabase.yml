name: Migrate Abastecimiento to Supabase

on:
  push:
    paths:
      - '.github/scripts/migrate_abastecimiento.py'
      - '.github/workflows/migrate-abastecimiento-supabase.yml'

permissions:
  contents: write

jobs:
  migrate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0
      - name: Apply migration patch
        run: python .github/scripts/migrate_abastecimiento.py
      - name: Validate
        run: |
          npm ci
          npm run check
          npm run validate
          npm test || true
          npm run build
      - name: Commit migration
        run: |
          rm -f .github/workflows/migrate-abastecimiento-supabase.yml
          rm -f .github/scripts/migrate_abastecimiento.py
          git config user.name "NahuelGarciaDelta"
          git config user.email "nahuel.garcia@deltamining.com.ar"
          git add -A
          git commit -m "Migrar Abastecimiento a Supabase"
          git push origin main
