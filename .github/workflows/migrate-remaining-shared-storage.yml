name: Migrate remaining shared storage
on:
  push:
    paths:
      - '.github/workflows/migrate-remaining-shared-storage.yml'
permissions:
  contents: write
jobs:
  migrate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0
      - name: Apply patches
        run: python .github/scripts/migrate_remaining_shared_storage.py
      - name: Validate
        run: |
          npm ci
          npm run check
          npm run validate
          npm test -- --run-in-band || npm test
          npm run build
      - name: Commit
        run: |
          rm -f .github/workflows/migrate-remaining-shared-storage.yml .github/scripts/migrate_remaining_shared_storage.py .github/workflows/audit-shared-storage.yml
          git config user.name "NahuelGarciaDelta"
          git config user.email "nahuel.garcia@deltamining.com.ar"
          git add -A
          git commit -m "Migrar almacenamiento compartido operativo a Supabase"
          git push origin main
