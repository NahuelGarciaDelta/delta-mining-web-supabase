name: Improve Supabase cache and Abastecimiento

on:
  push:
    paths:
      - '.github/workflows/improve-supabase-cache-abastecimiento.yml'

permissions:
  contents: write

jobs:
  improve:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0

      - name: Apply performance fixes
        shell: bash
        run: |
          python <<'PY'
          from pathlib import Path

          def replace_once(path, old, new):
              p=Path(path)
              s=p.read_text(encoding='utf-8')
              if old not in s:
                  raise SystemExit(f'Pattern not found in {path}: {old[:120]!r}')
              p.write_text(s.replace(old,new,1),encoding='utf-8')

          # 1) IndexedDB: preserve the compatibility alias consumed by App.jsx.
          replace_once(
              'src/services/appCache.js',
              'return {...record,data,value:undefined,version:Number(record.version||data?.meta?.serverVersion||0)};',
              'return {...record,data,value:data,version:Number(record.version||data?.meta?.serverVersion||0)};'
          )

          # 2) App: every VIEW_SOURCES dataset is directly readable from Supabase.
          p=Path('src/App.jsx')
          s=p.read_text(encoding='utf-8')
          s=s.replace(
              'import { fetchAction, fetchHealth, fetchSource, fetchSyncVersions, runWithConcurrency_ } from "./services/appsScriptApi.js";',
              'import { fetchAction, fetchHealth, fetchSource, runWithConcurrency_ } from "./services/appsScriptApi.js";'
          )
          marker='''const ALL_APP_PRELOAD_SOURCES=Object.freeze(\n  Array.from(new Set(Object.values(VIEW_SOURCES).flat()))\n);'''
          insertion='''const ALL_APP_PRELOAD_SOURCES=Object.freeze(\n  Array.from(new Set(Object.values(VIEW_SOURCES).flat()))\n);\nconst SUPABASE_OPERATIONAL_KEYS=Object.freeze(new Set([\n  "rop02_fs","rop02_jm","rop02_filosur","rop02_zorro",\n  "rop05","rma15_fs","rma15_jm","lista_equipos","insumos"\n]));'''
          if marker not in s: raise SystemExit('ALL_APP_PRELOAD_SOURCES marker missing')
          s=s.replace(marker,insertion,1)
          old='''      const typedKeys=new Set(["rop05","rma15_fs","rma15_jm","lista_equipos","insumos"]);\n      const fetched=typedKeys.has(key)\n        ?await getOperationalSource(key)\n        :await fetchSource(APPS_SCRIPT_URL,key,{force,since:force?'':getCachedSourceTimestamp(cacheRecord)});'''
          new='''      const fetched=SUPABASE_OPERATIONAL_KEYS.has(key)\n        ?await getOperationalSource(key)\n        :await fetchSource(APPS_SCRIPT_URL,key,{force,since:force?'':getCachedSourceTimestamp(cacheRecord)});'''
          if old not in s: raise SystemExit('typedKeys block missing')
          s=s.replace(old,new,1)
          old='''      const syncInfo=force?null:await fetchSyncVersions(APPS_SCRIPT_URL);\n      const serverVersions=syncInfo?.versions||{};\n      const results=await Promise.allSettled(toCheck.map(key=>fetchOneSource(key,{force,serverVersions,cacheRecords})));'''
          new='''      // Las fuentes operativas de esta app se leen directo de Supabase. Solo\n      // una fuente futura/legacy necesita versionado de Apps Script; no bloqueamos\n      // las pestañas actuales con ese round-trip.\n      const serverVersions={};\n      const results=await Promise.allSettled(toCheck.map(key=>fetchOneSource(key,{force,serverVersions,cacheRecords})));'''
          if old not in s: raise SystemExit('sync versions block missing')
          s=s.replace(old,new,1)

          # Hydrate the complete local cache immediately after authentication.
          anchor='''  // ─── Precarga global ─────────────────────────────────────────────────────\n  // Al autenticarse, llena en segundo plano el cache de TODAS las fuentes comunes.'''
          hydration='''  // Restauración inmediata desde IndexedDB: las pestañas pueden renderizar\n  // con la última copia válida antes de iniciar cualquier consulta de red.\n  useEffect(()=>{\n    if(!auth)return;\n    hydrateSourcesFromCache(ALL_APP_PRELOAD_SOURCES).catch(()=>{});\n  },[auth,hydrateSourcesFromCache]);\n\n'''
          if anchor not in s: raise SystemExit('global preload anchor missing')
          s=s.replace(anchor,hydration+anchor,1)

          # Start network prefetch shortly after login instead of waiting up to 1.5 s for idle.
          old='''    if(typeof window.requestIdleCallback==="function"){\n      idleId=window.requestIdleCallback(run,{timeout:1500});\n    }else{\n      timeoutId=window.setTimeout(run,350);\n    }'''
          new='''    // El cache local ya fue hidratado arriba. La revalidación arranca pronto y\n    // siempre en segundo plano para que el usuario no llegue antes que el prefetch.\n    timeoutId=window.setTimeout(run,80);'''
          if old not in s: raise SystemExit('global preload scheduler missing')
          s=s.replace(old,new,1)

          # Active view should never wait for requestIdleCallback.
          old='''  useEffect(()=>{\n    if(view==="dashboard"&&Object.keys(rawSourcesRef.current||{}).length===0){loadInitial();return;}\n    let cancelled=false;\n    const run=()=>{if(!cancelled)loadSources(VIEW_SOURCES[view]||[],{background:true});};\n    const id=typeof window.requestIdleCallback==="function"\n      ?window.requestIdleCallback(run,{timeout:250})\n      :window.setTimeout(run,60);\n    return()=>{\n      cancelled=true;\n      if(typeof window.cancelIdleCallback==="function")window.cancelIdleCallback(id);\n      else window.clearTimeout(id);\n    };\n  },[view,loadSources,loadInitial]);'''
          new='''  useEffect(()=>{\n    if(view==="dashboard"&&Object.keys(rawSourcesRef.current||{}).length===0){loadInitial();return;}\n    // La vista activa tiene prioridad: primero usa IndexedDB y revalida Supabase\n    // inmediatamente en background, sin esperar a que el navegador quede idle.\n    loadSources(VIEW_SOURCES[view]||[],{background:true}).catch(()=>{});\n  },[view,loadSources,loadInitial]);'''
          if old not in s: raise SystemExit('active view idle scheduler missing')
          s=s.replace(old,new,1)
          p.write_text(s,encoding='utf-8')

          # 3) Abastecimiento: remove first-visit chunk loader. The module is bundled/eager.
          Path('src/modules/abastecimiento/AbastecimientoRoute.jsx').write_text('''import React from "react";\nimport { AbastecimientoModule } from "./AbastecimientoModule.jsx";\n\nexport default function AbastecimientoRoute(props) {\n  return <AbastecimientoModule {...props} />;\n}\n''',encoding='utf-8')

          # 4) Abastecimiento: cache RABA03, timeout remote calls, parallelize bootstrap.
          p=Path('src/modules/abastecimiento/AbastecimientoModule.jsx')
          s=p.read_text(encoding='utf-8')
          s=s.replace(
              'import { registerRefreshTask } from "../../services/refreshManager.js";',
              'import { registerRefreshTask } from "../../services/refreshManager.js";\nimport { readCachedSource, writeCachedSource } from "../../services/appCache.js";',1
          )
          marker='''const RABA03_CLOSED_STORAGE_KEY = "dm_raba03_solicitudes_cerradas_manual_v1";'''
          helper='''const RABA03_CLOSED_STORAGE_KEY = "dm_raba03_solicitudes_cerradas_manual_v1";\nconst RABA03_DATA_CACHE_KEY = "abastecimiento_raba03_rows_v1";\nconst ABASTECIMIENTO_FETCH_TIMEOUT_MS = 15000;\n\nasync function fetchAbastecimiento(url,options={}){\n  const controller=new AbortController();\n  const timer=window.setTimeout(()=>controller.abort(),ABASTECIMIENTO_FETCH_TIMEOUT_MS);\n  try{\n    return await fetch(url,{...options,signal:controller.signal});\n  }catch(error){\n    if(error?.name==="AbortError")throw new Error("La consulta de Abastecimiento superó 15 segundos. Se muestran los últimos datos guardados.");\n    throw error;\n  }finally{\n    window.clearTimeout(timer);\n  }\n}'''
          if marker not in s: raise SystemExit('RABA cache marker missing')
          s=s.replace(marker,helper,1)

          # Replace the three GET calls used during bootstrap with bounded requests.
          s=s.replace('''      const res=await fetch(`${APPS_SCRIPT_URL}?action=estados_solicitudes&force=1&_=${Date.now()}`,{cache:"no-store",redirect:"follow"});''',
                      '''      const res=await fetchAbastecimiento(`${APPS_SCRIPT_URL}?action=estados_solicitudes&force=1&_=${Date.now()}`,{cache:"no-store",redirect:"follow"});''',1)
          s=s.replace('''      const res=await fetch(url,{method:"GET",cache:"no-store",redirect:"follow"});''',
                      '''      const res=await fetchAbastecimiento(url,{method:"GET",cache:"no-store",redirect:"follow"});''',1)
          s=s.replace('''      const res=await fetch(url,{cache:"no-store"});\n      const json=await res.json();''',
                      '''      const res=await fetchAbastecimiento(url,{cache:"no-store"});\n      if(!res.ok)throw new Error(`Error HTTP ${res.status}`);\n      const json=await res.json();''',1)

          old='''      const sentMap=Array.isArray(remitosOverride)?buildSentByCode(remitosOverride):sentByCodeRef.current;\n      setRows(mapRaba03Rows(raw,sentMap));'''
          new='''      const sentMap=Array.isArray(remitosOverride)?buildSentByCode(remitosOverride):sentByCodeRef.current;\n      const normalizedRows=mapRaba03Rows(raw,sentMap);\n      setRows(normalizedRows);\n      writeCachedSource(RABA03_DATA_CACHE_KEY,{ok:true,data:normalizedRows,meta:{updatedAt:new Date().toISOString(),rows:normalizedRows.length}}).catch(()=>{});'''
          if old not in s: raise SystemExit('RABA setRows block missing')
          s=s.replace(old,new,1)

          old='''  // Carga inicial coordinada: primero se esperan los remitos y estados reales;\n  // recién entonces se normaliza RABA03 con esas cantidades. Pasar los remitos\n  // como argumento evita depender de que React haya completado setRemitos.\n  useEffect(()=>{\n    if(raba03InitialLoadDoneRef.current)return;\n    raba03InitialLoadDoneRef.current=true;\n    let cancelled=false;\n    const run=async()=>{\n      let sharedRemitos=null;\n      try{sharedRemitos=await loadRemitosCompartidos({silent:true});}catch(_){}\n      try{await loadEstadosSolicitudesCompartidos({silent:true});}catch(_){}\n      if(cancelled)return;\n      await loadRaba03({silent:false,remitosOverride:sharedRemitos});\n    };\n    run();\n    return()=>{cancelled=true;};\n  },[loadRaba03,loadRemitosCompartidos,loadEstadosSolicitudesCompartidos]);'''
          new='''  // Carga inicial stale-while-revalidate: primero pinta la última copia local\n  // y luego sincroniza remitos/estados en paralelo. Nunca queda esperando una\n  // solicitud de red de forma indefinida.\n  useEffect(()=>{\n    if(raba03InitialLoadDoneRef.current)return;\n    raba03InitialLoadDoneRef.current=true;\n    let cancelled=false;\n    const run=async()=>{\n      let hasCachedRows=false;\n      try{\n        const cached=await readCachedSource(RABA03_DATA_CACHE_KEY);\n        const cachedRows=cached?.value?.ok&&Array.isArray(cached.value.data)?cached.value.data:[];\n        if(cachedRows.length&&!cancelled){\n          hasCachedRows=true;\n          setRows(cachedRows);\n          setLoading(false);\n        }\n      }catch(_){}\n\n      const [remitosResult]=await Promise.allSettled([\n        loadRemitosCompartidos({silent:true}),\n        loadEstadosSolicitudesCompartidos({silent:true})\n      ]);\n      if(cancelled)return;\n      const sharedRemitos=remitosResult.status==="fulfilled"?remitosResult.value:null;\n      await loadRaba03({silent:hasCachedRows,remitosOverride:sharedRemitos});\n      if(!hasCachedRows)setLoading(false);\n    };\n    run().catch(err=>{\n      if(!cancelled){setError(err?.message||String(err));setLoading(false);}\n    });\n    return()=>{cancelled=true;};\n  },[loadRaba03,loadRemitosCompartidos,loadEstadosSolicitudesCompartidos]);'''
          if old not in s: raise SystemExit('RABA initial bootstrap block missing')
          s=s.replace(old,new,1)
          p.write_text(s,encoding='utf-8')

          # Update regression test to validate cache + parallel bootstrap rather than old serialization.
          p=Path('tests/abastecimiento-regression.test.mjs')
          s=p.read_text(encoding='utf-8')
          old='''test("Abastecimiento espera remitos reales antes de calcular RABA03 al abrir", () => {\n  assert.match(moduleSource, /sharedRemitos=await loadRemitosCompartidos\\(\\{silent:true\\}\\)/);\n  assert.match(moduleSource, /loadRaba03\\(\\{silent:false,remitosOverride:sharedRemitos\\}\\)/);\n  assert.match(moduleSource, /const sentMap=Array\\.isArray\\(remitosOverride\\)\\?buildSentByCode\\(remitosOverride\\):sentByCodeRef\\.current/);\n});'''
          new='''test("Abastecimiento usa cache inmediato y revalida remitos/estados sin bloquear", () => {\n  assert.match(moduleSource, /readCachedSource\\(RABA03_DATA_CACHE_KEY\\)/);\n  assert.match(moduleSource, /Promise\\.allSettled\\(\\[/);\n  assert.match(moduleSource, /loadRaba03\\(\\{silent:hasCachedRows,remitosOverride:sharedRemitos\\}\\)/);\n  assert.match(moduleSource, /fetchAbastecimiento/);\n  assert.match(moduleSource, /const sentMap=Array\\.isArray\\(remitosOverride\\)\\?buildSentByCode\\(remitosOverride\\):sentByCodeRef\\.current/);\n});'''
          if old not in s: raise SystemExit('abastecimiento regression old test missing')
          s=s.replace(old,new,1)
          p.write_text(s,encoding='utf-8')

          # New performance regression guard.
          Path('tests/cache-navigation-performance.test.mjs').write_text('''import test from "node:test";\nimport assert from "node:assert/strict";\nimport fs from "node:fs";\n\nconst app=fs.readFileSync(new URL("../src/App.jsx",import.meta.url),"utf8");\nconst cache=fs.readFileSync(new URL("../src/services/appCache.js",import.meta.url),"utf8");\nconst route=fs.readFileSync(new URL("../src/modules/abastecimiento/AbastecimientoRoute.jsx",import.meta.url),"utf8");\n\ntest("IndexedDB conserva value para hidratar las vistas",()=>{\n  assert.match(cache,/value:data/);\n});\n\ntest("ROP02 y datasets operativos se leen directo de Supabase",()=>{\n  for(const key of ["rop02_fs","rop02_jm","rop02_filosur","rop02_zorro","rop05","rma15_fs","rma15_jm","lista_equipos","insumos"]) assert.match(app,new RegExp(`\\"${key}\\"`));\n  assert.match(app,/SUPABASE_OPERATIONAL_KEYS\\.has\\(key\\)/);\n  assert.doesNotMatch(app,/await fetchSyncVersions\\(APPS_SCRIPT_URL\\)/);\n});\n\ntest("la vista activa no difiere la carga con requestIdleCallback",()=>{\n  assert.match(app,/loadSources\\(VIEW_SOURCES\\[view\\]\\|\\|\\[\\],\\{background:true\\}\\)\\.catch/);\n});\n\ntest("Abastecimiento no depende de un chunk lazy en la primera apertura",()=>{\n  assert.match(route,/import \\{ AbastecimientoModule \\}/);\n  assert.doesNotMatch(route,/React\\.lazy|Suspense/);\n});\n''',encoding='utf-8')

          # The workflow is a one-shot migration; remove itself from the resulting commit.
          Path('.github/workflows/improve-supabase-cache-abastecimiento.yml').unlink(missing_ok=True)
          PY

      - name: Validate
        run: |
          npm ci
          npm run check
          npm run validate
          npm test
          npm run build

      - name: Commit improvements
        run: |
          git config user.name "Delta Mining Performance Bot"
          git config user.email "actions@users.noreply.github.com"
          git add -A
          if git diff --cached --quiet; then
            echo "No changes to commit"
            exit 0
          fi
          git commit -m "Optimizar cache Supabase y carga de Abastecimiento"
          git push origin HEAD:main
